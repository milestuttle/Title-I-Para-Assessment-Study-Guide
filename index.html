<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title I Paraprofessional Assessment Study Guide</title>
  <meta name="description" content="Interactive study guide and practice test engine for the Title I Paraprofessional Exam covering Reading, Writing, Math, and K-3 instructional scenarios.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">P1</div>
        <div>
          <div class="brand-title">Title I Para Prep</div>
          <div class="brand-subtitle">Study Guide & Quiz App</div>
        </div>
      </div>

      <div class="nav-section">
        <div class="nav-label">Study Modules</div>
        <ul class="nav-menu">
          <li>
            <a class="nav-link active" data-tab="dashboard">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              Dashboard
            </a>
          </li>
          <li>
            <a class="nav-link" data-tab="general">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
              General Guide
            </a>
          </li>
          <li>
            <a class="nav-link" data-tab="reading">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
              Expanded Reading
            </a>
          </li>
          <li>
            <a class="nav-link" data-tab="writing">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              Expanded Writing
            </a>
          </li>
          <li>
            <a class="nav-link" data-tab="math">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
              Expanded Math
            </a>
          </li>
        </ul>

        <div class="nav-label">Practice Tools</div>
        <ul class="nav-menu">
          <li>
            <a class="nav-link" data-tab="flashcards">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
              Flashcards
              <span class="badge" id="flashcard-nav-badge">19 Cards</span>
            </a>
          </li>
          <li>
            <a class="nav-link" data-tab="quiz">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              Sample Assessment
              <span class="badge">15 Qs</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <button class="theme-toggle-btn" id="theme-toggle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          Dark Mode
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
      <!-- Top Header Bar -->
      <header class="top-header">
        <button class="mobile-menu-toggle" id="mobile-menu-toggle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search concepts, grammar rules, math tips...">
        </div>

        <div class="header-actions">
          <div class="progress-widget">
            <span class="progress-text-label" id="global-progress-text">0% Mastery</span>
            <div class="progress-bar-container">
              <div class="progress-bar-fill" id="global-progress-bar"></div>
            </div>
          </div>
        </div>
      </header>

      <!-- Page Views -->
      <div class="content-container">
        <!-- View: Dashboard -->
        <section id="view-dashboard" class="view-section active"></section>

        <!-- View: General Study Guide -->
        <section id="view-general" class="view-section"></section>

        <!-- View: Expanded Reading -->
        <section id="view-reading" class="view-section"></section>

        <!-- View: Expanded Writing -->
        <section id="view-writing" class="view-section"></section>

        <!-- View: Expanded Math -->
        <section id="view-math" class="view-section"></section>

        <!-- View: Flashcards -->
        <section id="view-flashcards" class="view-section"></section>

        <!-- View: Practice Assessment Quiz -->
        <section id="view-quiz" class="view-section"></section>

        <!-- View: Search Results -->
        <section id="view-search" class="view-section">
          <h2 style="font-size:1.8rem; font-weight:800; margin-bottom:1rem;">Search Results</h2>
          <div id="search-results"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="study_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
